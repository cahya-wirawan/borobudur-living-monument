name: CI
on:
  push:
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm version:check
      - run: pnpm validate:content
      - run: pnpm registers:generate --check
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
      # The release audit is expected to FAIL while claims are unreviewed drafts.
      # It is reported, not enforced, until a public release is being prepared.
      - name: Release audit (informational)
        run: pnpm audit:release || echo "::warning::Release audit failing — prototype only, not publishable"

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker compose build
      - name: Start and smoke-test the container
        run: |
          docker compose up -d
          for i in $(seq 1 30); do curl -sf -o /dev/null http://localhost:3000/ && break; sleep 1; done
          for path in / /en/experience /id/read /en/sources /en/about; do
            test "$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:3000$path")" = "200"
          done
          curl -sI http://localhost:3000/en/read | grep -qi 'content-security-policy'
          test "$(docker compose exec -T web whoami)" = "node"
          docker compose down
