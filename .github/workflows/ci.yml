name: CI
on:
  push:
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm version:check
      - run: pnpm validate:content
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      # The release audit is expected to FAIL while claims are unreviewed drafts.
      # It is reported, not enforced, until a public release is being prepared.
      - name: Release audit (informational)
        run: pnpm audit:release || echo "::warning::Release audit failing — prototype only, not publishable"
